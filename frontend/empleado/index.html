<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookTrack — Repartidor</title>
  <link rel="stylesheet" href="../assets/css/booktrack.css">
</head>
<body>

<div class="topbar">
  <span class="logo">BOOKTRACK</span>
  <span class="badge">Panel Repartidor</span>
  <a href="../../index.html" style="margin-left:auto; color:var(--text-muted); font-size:13px; text-decoration:none;">← Volver</a>
</div>

<div class="main">

  <div class="card">
    <div class="card-title">🛵 Buscar Pedido</div>
    <div class="form-group">
      <label>ID de Seguimiento</label>
      <input type="text" id="idBuscar" placeholder="Ej: BT-XXXXXXXX" style="text-transform:uppercase;">
    </div>
    <button class="btn btn-blue" onclick="buscarPedido()">🔍 Buscar Pedido</button>
    <div class="alert alert-error" id="alertBuscar"></div>
  </div>

  <div id="panelPedido" style="display:none;">

    <div class="card">
      <div class="card-title">📦 Detalle del Pedido</div>
      <div class="grid-2">
        <div>
          <label>Cliente</label>
          <p id="detNombre" style="color:var(--text); margin-bottom:12px;"></p>
          <label>Teléfono</label>
          <p id="detTelefono" style="color:var(--text); margin-bottom:12px;"></p>
          <label>Libro(s)</label>
          <p id="detLibros" style="color:var(--text);"></p>
        </div>
        <div>
          <label>Dirección</label>
          <p id="detDireccion" style="color:var(--amber); margin-bottom:12px; font-weight:600;"></p>
          <label>Monto</label>
          <p id="detMonto" style="color:var(--text); margin-bottom:12px;"></p>
          <label>Estado Actual</label>
          <p id="detEstado"></p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🔄 Actualizar Estado</div>
      <div class="timeline" id="timeline"></div>
      <button class="btn btn-green" onclick="avanzarEstado()" id="btnAvanzar">✔ Confirmar Siguiente Estado</button>
      <div class="alert" id="alertEstado"></div>
    </div>

    <div class="card" style="border-color: var(--red);">
      <div class="card-title" style="color:var(--red);">⚠ Reportar Incidencia</div>
      <div class="grid-2">
        <button class="btn btn-red" onclick="reportar('Retraso por tráfico en autopista de Caracas.')">🚗 Tráfico en Autopista</button>
        <button class="btn btn-red" onclick="reportar('Retraso por lluvia fuerte. Esperando que escampe.')">🌧 Lluvia Fuerte</button>
        <button class="btn btn-red" onclick="reportar('Inconveniente con el vehículo. Gestionando solución.')">🔧 Problema con Vehículo</button>
        <button class="btn btn-ghost" onclick="reportarOtra()">✏ Otra Incidencia</button>
      </div>
      <div class="alert" id="alertIncidencia"></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
  let pedidos = JSON.parse(localStorage.getItem('bt_pedidos') || '[]');
  let pedidoActual = null;
  const estados = ['Preparando', 'En Ruta', 'Por Llegar', 'Entregado'];
  const iconos  = ['📦', '🛵', '📍', '✅'];

  function buscarPedido() {
    const id = document.getElementById('idBuscar').value.trim().toUpperCase();
    pedidoActual = pedidos.find(p => p.id === id);

    if (!pedidoActual) {
      document.getElementById('alertBuscar').textContent = '⚠ ID no encontrado. Verifica con el empleado.';
      document.getElementById('alertBuscar').className = 'alert alert-error show';
      document.getElementById('panelPedido').style.display = 'none';
      return;
    }

    document.getElementById('alertBuscar').className = 'alert';
    document.getElementById('panelPedido').style.display = 'block';
    renderDetalle();
    renderTimeline();
  }

  function renderDetalle() {
    document.getElementById('detNombre').textContent    = pedidoActual.nombre;
    document.getElementById('detTelefono').textContent  = pedidoActual.telefono;
    document.getElementById('detLibros').textContent    = pedidoActual.libros;
    document.getElementById('detDireccion').textContent = pedidoActual.direccion;
    document.getElementById('detMonto').textContent     = '$' + pedidoActual.monto.toFixed(2);
    document.getElementById('detEstado').innerHTML      = `<span class="status status-${claseEstado(pedidoActual.estado)}">${pedidoActual.estado}</span>`;
  }

  function renderTimeline() {
    const idx = estados.indexOf(pedidoActual.estado);
    document.getElementById('timeline').innerHTML = estados.map((e, i) => `
      <div class="tl-step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
        <div class="tl-dot">${i < idx ? '✔' : iconos[i]}</div>
        <div class="tl-label">${e}</div>
      </div>
    `).join('');

    const btnAvanzar = document.getElementById('btnAvanzar');
    btnAvanzar.style.display = pedidoActual.estado === 'Entregado' ? 'none' : 'flex';
  }

  function avanzarEstado() {
    const idx = estados.indexOf(pedidoActual.estado);
    if (idx >= estados.length - 1) return;

    pedidoActual.estado = estados[idx + 1];
    pedidoActual.incidencia = '';
    guardar();
    renderDetalle();
    renderTimeline();

    const alerta = document.getElementById('alertEstado');
    alerta.textContent = `✔ Estado actualizado a: ${pedidoActual.estado}`;
    alerta.className = 'alert alert-success show';
  }

  function reportar(msg) {
    if (!pedidoActual) return;
    pedidoActual.incidencia = msg;
    guardar();
    const alerta = document.getElementById('alertIncidencia');
    alerta.textContent = '✔ Incidencia reportada. El cliente podrá verla.';
    alerta.className = 'alert alert-warning show';
  }

  function reportarOtra() {
    const msg = prompt('Describe la incidencia:');
    if (msg) reportar(msg);
  }

  function guardar() {
    const idx = pedidos.findIndex(p => p.id === pedidoActual.id);
    pedidos[idx] = pedidoActual;
    localStorage.setItem('bt_pedidos', JSON.stringify(pedidos));
  }

  function claseEstado(e) {
    return e === 'Preparando' ? 'preparando' : e === 'En Ruta' ? 'ruta' : e === 'Por Llegar' ? 'llegar' : 'entregado';
  }
</script>
</body>
</html>
